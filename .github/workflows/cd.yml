name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: Check production SSH without publishing or deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ai-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && !inputs.diagnose_only && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # A manual CD run must also pass tests for the exact checked-out commit.
      - uses: actions/setup-python@v7.0.0
        if: github.event_name == 'workflow_dispatch'
        with:
          python-version: '3.12'
          cache: pip
      - name: Test manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest
      - name: Resolve immutable tag and lowercase GHCR image
        id: vars
        run: |
          echo "tag=sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: >-
      always() && !cancelled() &&
      (needs.publish.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.diagnose_only))
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Install SSH credentials
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set VPS_HOST secret}"
          : "${VPS_USER:?Set VPS_USER secret}"
          : "${VPS_SSH_KEY:?Set VPS_SSH_KEY secret}"
          [[ "$VPS_HOST" != -* && "$VPS_HOST" != *[[:space:]]* ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 > /dev/null; then
            echo 'VPS_SSH_KEY must be a valid private key without a passphrase' >&2
            exit 1
          fi
          if [[ -n "$VPS_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
      - name: Verify production SSH authentication and remote shell
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -vv -F /dev/null -T -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'printf "SSH authentication and remote command OK\n"; command -v bash docker flock'
      - name: Diagnose streamed Bash and Compose prerequisites
        if: inputs.diagnose_only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/calories-detect' }}
        run: |
          set -euo pipefail
          printf -v probe_command 'bash -s -- %q' "$VPS_DEPLOY_PATH"
          ssh -vv -F /dev/null -T -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "$probe_command" <<'PROBE'
          set -euo pipefail
          echo 'Streamed Bash started'
          cd "$1"
          test -f docker-compose.yml || { echo 'Missing docker-compose.yml' >&2; exit 1; }
          test -f .env || { echo 'Missing .env' >&2; exit 1; }
          test -w .env || { echo '.env is not writable' >&2; exit 1; }
          docker compose version
          echo 'Configured Compose services:'
          docker compose --env-file .env -f docker-compose.yml config --services
          echo 'Checking the original Compose service pipeline:'
          for attempt in {1..20}; do
            services="$(docker compose --env-file .env -f docker-compose.yml config --services)"
            grep -Fxq ai <<< "$services"
            printf 'Attempt %s: Compose service check OK\n' "$attempt"
          done
          echo 'Read-only prerequisites check completed'
          PROBE
      - name: Update AI_TAG and deploy existing Compose service
        if: ${{ !inputs.diagnose_only }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/calories-detect' }}
          AI_TAG: ${{ needs.publish.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$AI_TAG" =~ ^sha-[a-f0-9]{40}$ ]]
          # Quote arguments for the remote login shell, including paths with spaces.
          printf -v remote_command 'bash -s -- %q %q' "$AI_TAG" "$VPS_DEPLOY_PATH"
          # Send registry credentials through encrypted stdin, not command arguments.
          {
          printf 'GHCR_TOKEN=%q\nGHCR_USER=%q\n' "$GHCR_TOKEN" "$GHCR_USER"
          cat <<'REMOTE'
          set -euo pipefail
          tag="$1"
          cd "$2"
          test -f docker-compose.yml
          test -f .env

          # Coordinate with backend deployments that use the same lock.
          exec 9>.deploy.lock
          flock -w 300 9
          compose=(docker compose --env-file .env -f docker-compose.yml)
          unset AI_TAG
          # Drain Compose output before matching: grep -q on a live pipe can
          # close it early and make the Docker CLI exit 255 under pipefail.
          if ! services="$("${compose[@]}" config --services)"; then
            echo 'Compose configuration could not be read' >&2
            exit 1
          fi
          if ! grep -Fxq ai <<< "$services"; then
            echo 'Compose service ai is missing' >&2
            exit 1
          fi

          umask 077
          registry_config="$(mktemp -d)"
          trap 'rm -rf "$registry_config"' EXIT
          export DOCKER_CONFIG="$registry_config"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          unset GHCR_TOKEN
          # Remember only AI_TAG so rollback preserves other services' updates.
          previous_tag_lines="$(grep '^AI_TAG=' .env || true)"
          if grep -q '^AI_TAG=' .env; then
            sed -i "s|^AI_TAG=.*|AI_TAG=${tag}|" .env
          else
            printf '\nAI_TAG=%s\n' "$tag" >> .env
          fi

          if "${compose[@]}" config --quiet && \
             "${compose[@]}" pull ai && \
             "${compose[@]}" up -d --no-deps --no-build --wait --wait-timeout 120 ai; then
            echo "AI deployment healthy: $tag"
          else
            echo 'AI deployment failed; restoring previous AI_TAG' >&2
            sed -i '/^AI_TAG=/d' .env
            if [[ -n "$previous_tag_lines" ]]; then
              printf '%s\n' "$previous_tag_lines" >> .env
              if ! "${compose[@]}" up -d --no-deps --no-build --wait --wait-timeout 120 ai; then
                echo 'Previous AI deployment could not be restored; check the VPS' >&2
              fi
            else
              echo 'No previous AI_TAG exists; no earlier release can be restarted' >&2
            fi
            exit 1
          fi
          REMOTE
          } | ssh -F /dev/null -T -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "$remote_command"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
